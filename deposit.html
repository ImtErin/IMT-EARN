<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit - IMT EARN</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="card" style="text-align:center;">

<h1>💰 IMT EARN</h1>

<h3>Deposit Payment</h3>

<p>
Complete your payment and submit details.
</p>

</div>



<div class="card">


<h2>JazzCash Payment Details</h2>


<p><b>Account Holder Name</b></p>

<h3 style="color:#0d6efd;">
Ullah Rakhi
</h3>


<br>


<p><b>JazzCash Number</b></p>

<h2 style="color:#16a34a;">
03038369744
</h2>


<br>


<h3>Selected Package</h3>

<h2 id="packageName">
Loading...
</h2>


<h3>Package Amount</h3>

<h2 id="packageAmount">
Rs 0
</h2>


</div>
<div class="card">

<h2>Submit Payment Details</h2>


<input
type="number"
id="senderNumber"
placeholder="Sender Mobile Number">


<br><br>


<input
type="text"
id="trxId"
placeholder="Transaction ID (TRX ID)">


<br><br>


<input
type="file"
id="paymentScreenshot"
accept="image/*">


<br><br>


<button id="submitDeposit">
Submit Deposit Request
</button>


</div>


</div>


<script type="module">


import { auth, db } from "./firebase.js";


import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const packageNameElement =
document.getElementById("packageName");


const packageAmountElement =
document.getElementById("packageAmount");



const senderNumber =
document.getElementById("senderNumber");


const trxId =
document.getElementById("trxId");


const paymentScreenshot =
document.getElementById("paymentScreenshot");


const submitDeposit =
document.getElementById("submitDeposit");



const selectedPackage =
localStorage.getItem("selectedPackage");



const selectedAmount =
Number(localStorage.getItem("packageAmount"));



packageNameElement.innerHTML =
selectedPackage || "No Package Selected";



packageAmountElement.innerHTML =
"Rs " + (selectedAmount || 0);
  
onAuthStateChanged(auth,(user)=>{


if(!user){

window.location.href="login.html";

return;

}


});




submitDeposit.addEventListener("click", async()=>{


const user = auth.currentUser;



if(!user){

alert("Please login first.");

return;

}



if(!selectedPackage || !selectedAmount){


alert("Please select package first.");


return;


}



if(senderNumber.value.trim()==="" || trxId.value.trim()===""){


alert("Please fill all required fields.");


return;


}



try{


await addDoc(collection(db,"deposits"),{


uid:user.uid,


package:selectedPackage,


amount:selectedAmount,


senderNumber:senderNumber.value.trim(),


trxId:trxId.value.trim(),


status:"Pending",


createdAt:serverTimestamp()


});



alert("Deposit Request Submitted Successfully!");



window.location.href="pending.html";



}catch(error){


alert(error.message);


}



});


</script>


</body>

</html>
