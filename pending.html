<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Pending - IMT EARN</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card" style="text-align:center;">

<h1>🟡 Payment Under Review</h1>

<br>

<h2>Please Wait Up To 24 Hours</h2>

<br>

<p>
Your deposit request has been submitted successfully.
</p>

<br>

<p>
Our team is reviewing your payment.
Once approved, your account will be activated automatically.
</p>

<br>

<h3 id="statusText" style="color:orange;">
Status : Pending
</h3>

<br>

<button id="refreshBtn">
🔄 Refresh Status
</button>

</div>
<script type="module">

import { auth, db } from "./firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const refreshBtn = document.getElementById("refreshBtn");
const statusText = document.getElementById("statusText");

onAuthStateChanged(auth, (user) => {

if (!user) {

window.location.href = "login.html";
return;

}

refreshBtn.addEventListener("click", async () => {

try {

const userRef = doc(db, "users", user.uid);

const snap = await getDoc(userRef);

if (snap.exists()) {

const data = snap.data();

if (data.packageStatus === "Approved") {

alert("Congratulations! Your account has been approved.");

window.location.href = "index.html";

} else {

statusText.innerHTML = "🟡 Status : Pending";

alert("Your payment is still under review.");

}

}

} catch (error) {

alert(error.message);

}

});

});

</script>

</body>

</html>
