<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - IMT EARN</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card" style="text-align:center;">

<h1>🛠️ IMT EARN</h1>

<h2>Admin Panel</h2>

<p>Deposit Requests</p>

</div>

<div id="requestList">

</div>

</div> 
  <script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const requestList = document.getElementById("requestList");

onAuthStateChanged(auth, async (user) => {

if(!user){

window.location.href = "login.html";
return;

}

requestList.innerHTML = "<h3>Loading Requests...</h3>";

const snapshot = await getDocs(collection(db,"deposits"));

requestList.innerHTML = "";

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

requestList.innerHTML += `

<div class="card">

<h3>📦 ${data.package}</h3>

<p><b>Sender Number:</b> ${data.senderNumber}</p>

<p><b>TRX ID:</b> ${data.trxId}</p>

<p><b>Status:</b> ${data.status}</p>

<br>

<button onclick="approveRequest('${docSnap.id}')">
✅ Approve
</button>

<button onclick="rejectRequest('${docSnap.id}')">
❌ Reject
</button>

</div>

`;

});

});
    window.approveRequest = async (id) => {

try {

const { doc, updateDoc } = await import(
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
);

await updateDoc(doc(db, "deposits", id), {

status: "Approved"

});

alert("Deposit Approved Successfully!");

location.reload();

} catch (error) {

alert(error.message);

}

};

window.rejectRequest = async (id) => {

try {

const { doc, updateDoc } = await import(
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
);

await updateDoc(doc(db, "deposits", id), {

status: "Rejected"

});

alert("Deposit Rejected!");

location.reload();

} catch (error) {

alert(error.message);

}

};

</script>

</body>

</html>
