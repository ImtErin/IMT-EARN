<div class="card">

<h2>📥 Deposit Requests</h2>

<div id="requestList">

<h3>Loading Deposit Requests...</h3>

</div>

</div>


<div class="card">

<h2>💸 Withdraw Requests</h2>

<div id="withdrawList">

<h3>Loading Withdraw Requests...</h3>

</div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";


import {

onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {

collection,
getDocs,
doc,
getDoc,
setDoc,
updateDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const requestList =
document.getElementById("requestList");


const withdrawList =
document.getElementById("withdrawList");



onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="login.html";

return;

}



const depositSnapshot =
await getDocs(collection(db,"deposits"));



requestList.innerHTML="";



depositSnapshot.forEach((docSnap)=>{


const data = docSnap.data();



requestList.innerHTML += `

<div class="card">

<h3>📦 ${data.package || "No Package"}</h3>

<p><b>Amount:</b> Rs ${data.amount || 0}</p>

<p><b>Sender:</b> ${data.senderNumber || ""}</p>

<p><b>TRX ID:</b> ${data.trxId || ""}</p>

<p><b>Status:</b> ${data.status}</p>


<br>


<button onclick="approveRequest('${docSnap.id}')">

✅ Approve

</button>


<button onclick="rejectRequest('${docSnap.id}')">

❌ Reject

</button>


</div>

`;


});

// Deposit Approve System

window.approveRequest = async (id)=>{

try{


const depositRef = doc(db,"deposits",id);

const depositSnap = await getDoc(depositRef);


if(!depositSnap.exists()){

alert("Deposit not found");

return;

}


const depositData = depositSnap.data();



await updateDoc(depositRef,{

status:"Approved"

});



const userRef = doc(db,"users",depositData.uid);


const userSnap = await getDoc(userRef);



if(userSnap.exists()){


await updateDoc(userRef,{

package: depositData.package,

packageStatus:"Approved",

balance: Number(depositData.amount || 0),

updatedAt: serverTimestamp()

});


}else{


await setDoc(userRef,{

package: depositData.package,

packageStatus:"Approved",

balance: Number(depositData.amount || 0),

createdAt: serverTimestamp()

},{merge:true});


}



alert("Deposit Approved Successfully!");

location.reload();



}catch(error){

alert(error.message);

}


};




// Deposit Reject

window.rejectRequest = async(id)=>{


try{


await updateDoc(

doc(db,"deposits",id),

{

status:"Rejected"

}

);


alert("Deposit Rejected!");

location.reload();


}catch(error){

alert(error.message);

}


};
  

// Withdraw Requests Load

const withdrawSnapshot =
await getDocs(collection(db,"withdrawRequests"));


withdrawList.innerHTML="";


withdrawSnapshot.forEach((docSnap)=>{


const data = docSnap.data();


withdrawList.innerHTML += `

<div class="card">

<h3>💸 Withdraw Request</h3>

<p><b>Account Name:</b> ${data.accountName || ""}</p>

<p><b>Account Number:</b> ${data.accountNumber || ""}</p>

<p><b>Amount:</b> Rs ${data.amount || 0}</p>

<p><b>Status:</b> ${data.status || "Pending"}</p>


<br>


<button onclick="approveWithdraw('${docSnap.id}')">

✅ Approve

</button>


<button onclick="rejectWithdraw('${docSnap.id}')">

❌ Reject

</button>


</div>

`;

});




// Withdraw Approve

window.approveWithdraw = async(id)=>{


try{


await updateDoc(

doc(db,"withdrawRequests",id),

{

status:"Approved"

}

);


alert("Withdraw Approved Successfully!");

location.reload();


}catch(error){

alert(error.message);

}


};




// Withdraw Reject

window.rejectWithdraw = async(id)=>{


try{


await updateDoc(

doc(db,"withdrawRequests",id),

{

status:"Rejected"

}

);


alert("Withdraw Rejected!");

location.reload();


}catch(error){

alert(error.message);

}


};



</script>


</div>


</body>

</html>
