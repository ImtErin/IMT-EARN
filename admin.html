<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - IMT EARN</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card" style="text-align:center;">

<h1>🛠️ IMT EARN</h1>

<h2>Admin Panel</h2>

<p>Manage Deposit & Withdraw Requests</p>

</div>

<div class="card">

<h2>📥 Deposit Requests</h2>

<div id="requestList">

<h3>Loading Deposit Requests...</h3>

</div>

</div>

<div class="card">

<h2>💸 Withdraw Requests</h2>

<div id="withdrawList">

<h3>Loading Withdraw Requests...</h3>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const requestList = document.getElementById("requestList");
const withdrawList = document.getElementById("withdrawList");

onAuthStateChanged(auth, async (user) => {

if(!user){

window.location.href="login.html";

return;

}

requestList.innerHTML="<h3>Loading...</h3>";

withdrawList.innerHTML="<h3>Loading...</h3>";

const depositSnapshot = await getDocs(collection(db,"deposits"));

const withdrawSnapshot = await getDocs(collection(db,"withdrawRequests"));

requestList.innerHTML="";

withdrawList.innerHTML=""; 
depositSnapshot.forEach((docSnap)=>{

const data = docSnap.data();

requestList.innerHTML += `

<div class="card">

<h3>📦 ${data.package}</h3>

<p><b>Sender Number:</b> ${data.senderNumber}</p>

<p><b>TRX ID:</b> ${data.trxId}</p>

<p><b>Status:</b> ${data.status}</p>

<br>

<button onclick="approveRequest('${docSnap.id}')">
✅ Approve
</button>

<button onclick="rejectRequest('${docSnap.id}')">
❌ Reject
</button>

</div>

`;

});

withdrawSnapshot.forEach((docSnap)=>{

const data = docSnap.data();

withdrawList.innerHTML += `

<div class="card">

<h3>💸 Withdraw Request</h3>

<p><b>Method:</b> ${data.paymentMethod}</p>

<p><b>Account Holder:</b> ${data.accountName}</p>

<p><b>Account Number:</b> ${data.accountNumber}</p>

<p><b>Amount:</b> Rs ${data.amount}</p>

<p><b>Status:</b> ${data.status}</p>

<br>

<button onclick="approveWithdraw('${docSnap.id}')">
✅ Approve
</button>

<button onclick="rejectWithdraw('${docSnap.id}')">
❌ Reject
</button>

</div>

`;

});

}); 
window.approveRequest = async (id) => {

try {

const { doc, updateDoc } = await import(
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
);

await updateDoc(doc(db, "deposits", id), {

status: "Approved"

});

alert("Deposit Approved Successfully!");

location.reload();

} catch(error){

alert(error.message);

}

};

window.rejectRequest = async (id) => {

try {

const { doc, updateDoc } = await import(
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
);

await updateDoc(doc(db, "deposits", id), {

status: "Rejected"

});

alert("Deposit Rejected!");

location.reload();

} catch(error){

alert(error.message);

}

};

window.approveWithdraw = async (id) => {

try {

const { doc, updateDoc } = await import(
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
);

await updateDoc(doc(db, "withdrawRequests", id), {

status: "Approved"

});

alert("Withdraw Approved Successfully!");

location.reload();

} catch(error){

alert(error.message);

}

};

window.rejectWithdraw = async (id) => {

try {

const { doc, updateDoc } = await import(
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
);

await updateDoc(doc(db, "withdrawRequests", id), {

status: "Rejected"

});

alert("Withdraw Rejected!");

location.reload();

} catch(error){

alert(error.message);

}

};

</script>

</body>

</html>
